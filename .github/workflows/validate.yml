name: Validate My UNA World candidate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    name: PHP ${{ matrix.php }} backup and native updater regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, pdo_sqlite, dom, simplexml
          coverage: none
      - name: Backup timing, real archive/database round trip, access and updater checks
        run: python3 scripts/validate-candidate.py
